name: Bug report
description: Report a reproducible software defect without private audio artifacts.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload raw sessions, microphone files, device identifiers, room coordinates, or private paths. Use a reviewed redacted support artifact.
  - type: input
    id: version
    attributes: { label: Version, placeholder: 0.1.0-beta.1 }
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes: { label: Platform, options: [Windows x64, macOS Intel, macOS Apple Silicon, Linux x64, Linux ARM64] }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behavior }
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes: { label: Redacted audio_doctor/support output }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal paths, addresses, serials, room data, and raw measurements.
          required: true
