name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run security:verify
      - run: npm test
      - run: npm run validate:release
      - run: npm pack
      - run: npm sbom --sbom-format cyclonedx > audio-calibration-sbom.json
      - run: sha256sum audio-calibration-mcp-*.tgz audio-calibration-sbom.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: audio-calibration-mcp-*.tgz
      - name: Verify packed archive
        run: |
          mkdir release-smoke
          tar -xzf audio-calibration-mcp-*.tgz -C release-smoke
          cd release-smoke/package
          node scripts/validate-release.mjs
          node dist/cli.cjs capabilities '{}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audio-calibration-release
          path: |
            audio-calibration-mcp-*.tgz
            audio-calibration-sbom.json
            SHA256SUMS
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" audio-calibration-mcp-*.tgz audio-calibration-sbom.json SHA256SUMS --verify-tag --generate-notes --prerelease
